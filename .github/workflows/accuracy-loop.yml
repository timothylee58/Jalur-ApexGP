name: Prediction Accuracy Loop

# Every 10 minutes: lock a pre-session prediction for any session about to
# start, then record the outcome of any session that has just finished
# (backend/ml/accuracy_tick.py). Scheduled runs can start a few minutes
# late; the /accuracy page also resolves on read, so it doesn't wait on this.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: accuracy-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python ml/accuracy_tick.py
        env:
          # The same Supabase secrets the picks scorer uses.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
