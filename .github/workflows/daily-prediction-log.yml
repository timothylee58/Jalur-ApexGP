name: Daily Prediction Log

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  log-predictions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python ml/log_daily_run.py
        env:
          # Must point at the same durable backend the deployed app uses
          # (see backend/.env.example) — a bare "file:" store here would
          # write into the CI runner's throwaway filesystem and vanish the
          # moment this job ends, making the run pointless for same-day
          # trend history. Set these as repo secrets once you have a
          # Databricks CE workspace: Settings → Secrets and variables →
          # Actions.
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: ${{ secrets.MLFLOW_EXPERIMENT_NAME }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
