[project]
name = "jalur-apexgp-backend"
version = "0.1.0"
description = "Jalur APEXGP FastAPI strategy desk"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "mlflow-skinny==2.21.3",
  "httpx==0.28.1",
  "pydantic==2.11.1",
  "pydantic-settings==2.8.1",
  "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
