[project]
name = "jalur-apexgp-backend"
version = "0.1.0"
description = "Jalur APEXGP FastAPI strategy desk"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "mlflow-skinny==2.21.3",
  "httpx==0.28.1",
  "pydantic==2.11.1",
  "pydantic-settings==2.8.1",
  "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3"]

[tool.vercel]
# Pins the exact entrypoint rather than relying on Vercel's zero-config
# auto-detection, which independently scans app/ and src/ subdirectories
# for recognized filenames (including main.py) — and this repo's
# app/main.py is exactly that pattern, purely by coincidence of Python
# package naming, not because it's meant to be its own deployed function.
# Without this, that scan is a real ambiguity against the intentional
# api/index.py entrypoint, not a hypothetical one.
entrypoint = "api.index:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
